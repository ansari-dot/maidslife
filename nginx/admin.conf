server {
    listen 80;
    server_name admin.maidslife.com; # Ensure you point this subdomain to your VPS IP

    # The directory where your built React admin files are located
    root /var/www/maidslife/admin/dist;
    
    # The default file to serve
    index index.html index.htm;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Fallback to index.html for Single Page Applications (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (CSS, JS, Images, etc.) for better performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Deny access to hidden files (e.g., .env, .git)
    location ~ /\. {
        deny all;
    }
}
